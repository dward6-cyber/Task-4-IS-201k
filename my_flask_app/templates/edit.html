<!DOCTYPE html>
<html>
<head>
    <title>Редактировать</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        .message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .error {
            background: #ffe6e6;
            color: #cc0000;
        }

        .info {
            background: #fff3cd;
            color: #856404;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #45a049;
        }

        a {
            color: #999;
            text-decoration: none;
        }

        a:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Редактирование</h1>

        {% if message %}
            <div class="message {% if 'не может быть пустым' in message or 'не изменено' in message %}error{% else %}info{% endif %}">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST">
            <input type="text" name="task" value="{{ task.text }}" required>
            
            <label style="font-size: 14px; color: #555; margin-top: 5px;">Приоритет задачи:</label>
            <select name="priority" style="padding: 10px; border-radius: 5px; border: 1px solid #ddd; font-size: 14px; margin-bottom: 10px;">
                <option value="Низкий" {% if task.priority == 'Низкий' %}selected{% endif %}>Низкий</option>
                <option value="Обычный" {% if task.priority == 'Обычный' or not task.priority %}selected{% endif %}>Обычный</option>
                <option value="Высокий" {% if task.priority == 'Высокий' %}selected{% endif %}>Высокий</option>
            </select>
            
            <div class="buttons">
                <button type="submit">Сохранить</button>
                <a href="/">Отмена</a>
            </div>
        </form>
    </div>
</body>
</html>
